  # fast-xml-parser >= 4.5.4 rajoittaa entiteettien kokonaislaajennuksen
  # 1000:een (CVE-2026-26278 / CVE-2026-33036 -korjaus). SST:n deploy-monitor
  # lukee DescribeStackEvents-vastauksia, joissa on tuhansia &quot;-entiteetteja,
  # joten @aws-sdk/client-cloudformation 3.449.0 kaatuu virheeseen
  # "Entity expansion limit exceeded". Rajataan vain deployn aikainen
  # CloudFormation-asiakas vanhaan versioon; tuotantopolku
  # (@aws-sdk/client-ssm) pysyy korjatussa 4.5.x:ssa.
  # Poistettavissa kun sst:n AWS SDK nousee versioon, joka ei kayta
  # fast-xml-parseria (>= ~3.900, XML-jasennys siirtyi @smithy/coreen).
  "@aws-sdk/client-cloudformation>fast-xml-parser": 4.2.5
