name: Deploy

run-name: Deploy ${{ inputs.stage }}${{ inputs.skipDomain && ' (ilman domainia)' || '' }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Ympäristö johon deploy tehdään"
        required: true
        type: choice
        # Oletuksena vaarattomin ympäristö, jotta vahinkolaukaisu ei osu tuotantoon.
        default: untuva
        options:
          - untuva
          - hahtuva
          - pallero
          - sade

concurrency:
  # Yksi deploy kerrallaan ympäristöä kohden. Eri ympäristöt saavat edetä rinnakkain,
  # eikä käynnissä olevaa deployta keskeytetä kesken CloudFormation-päivityksen.
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  # Pakollinen OIDC-tunnistautumiselle: ilman tätä AWS-roolia ei voi ottaa käyttöön.
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.stage }}
    runs-on: ubuntu-latest
    env:
      # Syötteet välitetään ympäristömuuttujina eikä interpoloida suoraan skriptiin.
      STAGE: ${{ inputs.stage }}
      SKIP_DOMAIN: ${{ inputs.skipDomain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        name: Install pnpm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # Rooli valitaan ympäristön mukaan: untuva, hahtuva ja pallero ovat samalla
      # kehitystilillä, sade omallaan. Ehdot on kirjoitettu erikseen tarkoituksella —
      # jos salaisuus puuttuu, askel kaatuu sen sijaan että käyttäisi väärän tilin roolia.
      - name: Configure AWS credentials (dev)
        if: ${{ inputs.stage == 'untuva' || inputs.stage == 'hahtuva' || inputs.stage == 'pallero' }}
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          role-to-assume: ${{ secrets.AWS_OPINTOPOLKU_DEV_ROLE_ARN }}
          role-session-name: ${{ inputs.stage }}-tarjonta-pulssi-deploy
          aws-region: eu-west-1

      - name: Configure AWS credentials (prod)
        if: ${{ inputs.stage == 'sade' }}
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          role-to-assume: ${{ secrets.AWS_OPINTOPOLKU_PROD_ROLE_ARN }}
          role-session-name: ${{ inputs.stage }}-tarjonta-pulssi-deploy
          aws-region: eu-west-1

      # Varmistaa että jompikumpi yllä olevista askelista todella ajoi. Jos valikkoon
      # lisätään ympäristö eikä ehtoja päivitetä, deploy kaatuisi muuten vasta CDK:n
      # hämärään "CDK_DEFAULT_ACCOUNT on tyhjä" -virheeseen.
      - name: Varmista AWS-tunnistautuminen
        run: |
          aws sts get-caller-identity > identity.json
          cat identity.json
          {
            echo "## Deploy: \`$STAGE\`"
            echo
            echo "- AWS-tili: \`$(jq -r .Account identity.json)\`"
            echo "- Rooli: \`$(jq -r .Arn identity.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          rm identity.json

      - name: Deploy
        run: |
          # `--require-approval never`, koska stack muuttaa IAM-oikeuksia ja security
          # group -sääntöjä. Ilman tätä CDK jäisi odottamaan vahvistusta, jota
          # ei-interaktiivisessa ajossa ei voi antaa.
          pnpm run cdk:deploy -c "stage=$STAGE" --require-approval never

      - name: Login to utility
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_OPH_UTILITY_ROLE_ARN }}
          role-session-name: ${{ inputs.application }}-update-metadata
          aws-region: eu-west-1

      - name: Update deployment metadata
        run: |
          DEPLOY_TIMESTAMP=`TZ='Europe/Helsinki' date +'%Y-%m-%d %H:%M:%S %Z'`
          $BUILD_NAME=deploy-$GITHUB_RUN_NUMBER
          aws dynamodb put-item --table-name builds --item "{\"Service\": {\"S\": \"tarjonta-pulssi\"}, \"Build\": {\"S\": \"${BUILD_NAME}\"}, \"Branch\": {\"S\": \"${GITHUB_REF_NAME}\"}, \"Commit\": {\"S\": \"${GITHUB_SHA}\"}, \"Time\": {\"S\": \"${BUILD_TIMESTAMP}\"}}" --condition-expression "attribute_not_exists(Id)" --region eu-west-1
          aws dynamodb put-item --table-name deployments --item "{\"EnvService\": {\"S\": \"${{ inputs.stage }}-tarjonta-pulssi\"}, \"Build\": {\"S\": \"$BUILD_NAME\"}, \"User\": {\"S\": \"$GITHUB_TRIGGERING_ACTOR\"}, \"Time\": {\"S\": \"$DEPLOY_TIMESTAMP\"}}" --region eu-west-1
          aws dynamodb put-item --table-name services --item "{\"EnvService\": {\"S\": \"${{ inputs.stage }}-tarjonta-pulssi\"}, \"LatestDeployedBuild\": {\"S\": \"$BUILD_NAME\"}}" --region eu-west-1
